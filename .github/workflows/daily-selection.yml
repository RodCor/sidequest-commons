name: Select and scaffold the daily winner

on:
  schedule:
    - cron: "0 21 * * *"
      timezone: America/Argentina/Buenos_Aires
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  checks: write

concurrency:
  group: daily-selection
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted selector
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select exactly one screened winner
        run: node scripts/select-winner.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify the generated state without credentials
        run: |
          pnpm lint
          pnpm test
          pnpm security:scan
          pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Commit to an isolated round branch
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No eligible winner for this round."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "sidequest-commons[bot]"
          git config user.email "sidequest-commons[bot]@users.noreply.github.com"
          git add -- data/current-winner.json data/rounds projects
          git commit -m "round: select $(date -u +%F) daily sidequest"
          branch="round/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/${branch}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Attest that the generated commit passed the full gate
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=verify \
            -f head_sha="$COMMIT_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Daily winner verification' \
            -f 'output[summary]=Lint, tests, credential scan, and production build passed in the trusted selector workflow.'
      - name: Publish the verified winner
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:main
      - name: Close the winner and open its build tracker
        run: node scripts/finalize-winner.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Remove the temporary round branch
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          ROUND_BRANCH: ${{ steps.commit.outputs.branch }}
        run: git push origin --delete "$ROUND_BRANCH"
